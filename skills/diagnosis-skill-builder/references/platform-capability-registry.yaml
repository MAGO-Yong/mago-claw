version: 0.1
purpose: >
  Registry of official or expected platform Skills/CLI that Diagnosis Skill Builder
  can use to auto-match data acquisition and analysis dependencies while
  incubating a business alert diagnosis Skill.

dependency_status_values:
  confirmed: "User/platform confirmed this dependency is correct."
  candidate: "Likely match. Ask user to confirm only the business fit or permission boundary."
  verified: "Interface was checked with concrete input, but no live data was fetched."
  configured_for_trial: "Dependency, inputs, expected outputs, judgment, and failure policy are captured; full real-data verification is deferred to trial run."
  runtime_executable: "Dependency was invoked or read-only verified during trial run and returned usable data for the node judgment."
  executable: "Deprecated alias for runtime_executable. Do not use in user-facing Builder creation output."
  blocked: "Dependency exists but cannot be used now because of auth, permission, install, missing input, or runtime error."
  missing: "Needed capability is not confirmed available. Keep an interface and fallback."
  forbidden: "Do not use. Unofficial, unsafe, or blocked by platform policy."

global_verification_policy:
  applies_to: "all capabilities unless explicitly marked verification_supported: false"
  goal: "during creation, produce a correct verification plan; during trial run, prove the matched capability can fetch data that supports the SOP node judgment"
  creation_default: "match dependency, parse stable inputs, capture expected fields/judgment/failure policy, and run only cheap preflight when needed"
  trial_run_default: "run all required real-data verification and judgment checks before claiming runtime executable"
  required_verification_record_fields:
    - dependency_id
    - input_type
    - verification_status
    - returned_fields
    - missing_fields
    - judgment_test
    - blocker
  configured_for_trial_requires:
    - "dependency and invocation method are known"
    - "stable inputs and expected outputs are recorded"
    - "judgment and failure policy are recorded"
    - "trial-run verification task is recorded"
  runtime_executable_requires:
    - "dependency was invoked or read-only verified in the target runtime during trial run"
    - "returned fields are sufficient for the node judgment"
    - "auth/permission/runtime errors did not block the verification"
  if_not_executable:
    - "mark candidate, verified, blocked, missing, or forbidden"
    - "record the exact blocker or missing field"
    - "do not claim the generated Skill can execute this node end-to-end"
  judgment_types:
    - threshold
    - existence
    - overlap
    - diff
    - concentration
    - owner_match
    - checklist

capabilities:
  - id: xray-alarm
    type: skill
    platform: XRay
    official_status: official
    safety: read_only
    use_when:
      - "需要读取告警 event_id / alert_id 详情"
      - "需要查询告警规则、规则配置、告警 title、产品线/业务线"
      - "需要从告警 payload 补齐 metric、服务、owner、触发时间"
    data_inputs:
      - alert_id
      - event_id
      - rule_id
      - app
      - service
      - product_line
      - time_range
    data_outputs:
      - alert_event_detail
      - alert_rule_config
      - trigger_condition
      - alert_title
      - product_line
      - service_owner
    builder_mapping:
      node_types: [parse, filter, data_check]
      default_status: candidate
      common_nodes:
        - alert_detail_lookup
        - alert_rule_or_quality_check
        - alert_history_lookup

  - id: xray-metric-query
    type: skill
    platform: XRay
    official_status: official
    safety: read_only
    use_when:
      - "需要查询系统指标、业务指标、Cat 指标或 PromQL"
      - "需要对比同比/环比/上周同期/告警前后趋势"
      - "需要按场景、版本、实验组、人群、地域拆分指标"
    data_inputs:
      - metric_name
      - promql
      - service
      - app
      - tags
      - start_time
      - end_time
      - baseline_window
    data_outputs:
      - time_series
      - grouped_metric_rows
      - baseline_comparison
      - anomaly_points
    builder_mapping:
      node_types: [data_check, branch]
      default_status: candidate
      common_nodes:
        - metric_query
        - metric_group_by_scene
        - metric_group_by_version
        - metric_group_by_experiment
        - metric_group_by_user_segment
    verification:
      verification_supported: true
      accepted_verification_inputs:
        - metric_name
        - dashboard_url
        - promql
        - service
        - tags
        - time_range
      success_criteria:
        - "returns current metric value or time series"
        - "returns baseline or enough data to compute baseline"
        - "fields can support the node judgment rule"
      example_judgment:
        rule: "drop_ratio > 0.05"
        required_fields: [current_value, baseline_value]

  - id: xray-cli
    type: cli
    platform: XRay
    official_status: official
    safety: read_only
    runtime_contract:
      non_interactive: true
      prefer_json_output: true
      auth: "XRAY_TOKEN or xray-cli auth login handled by host"
    use_when:
      - "生成的诊断 Skill 需要脚本化、无人值守、结构化 JSON 输出"
      - "需要在 scripts/atomic 中封装可重复查询"
      - "需要通过 CLI 统一驱动 XRay 指标、日志或表查询"
    data_inputs:
      - command
      - table
      - mode
      - query
      - start_time
      - end_time
    data_outputs:
      - json_result
      - stderr
      - exit_code
    builder_mapping:
      node_types: [data_check]
      default_status: candidate
      common_nodes:
        - scripted_metric_query
        - scripted_log_query
        - atomic_query_wrapper
    verification:
      verification_supported: true
      accepted_verification_inputs:
        - command
        - metric_name
        - promql
        - dashboard_url
        - sql
        - table
      success_criteria:
        - "command exists and supports non-interactive execution"
        - "returns JSON or parseable output"
        - "exit_code is 0"

  - id: external-data-adapter
    type: adapter_pattern
    platform: generic
    official_status: adapter_to_be_bound
    safety: read_only_by_default
    runtime_contract:
      non_interactive: true
      invocation_method: "existing Skill, official CLI, official API, generated script, or manual placeholder"
      package_hint: "Use generated scripts only for read-only query/post-processing paths unless the user explicitly designs a controlled action."
    use_when:
      - "某个排障节点需要其他平台数据、SQL-like 查询、内部 API、报表、文件或自定义脚本"
      - "当前 registry 没有直接匹配的官方 Skill，但用户提供了稳定 locator/query/API/script"
      - "节点需要把多次查询、字段归一化、top-N、diff、threshold 或聚合逻辑封装成可复用 runtime"
    data_inputs:
      - source_type
      - locator
      - query_template
      - api_endpoint
      - script_path
      - auth_context
      - time_range
      - filters
      - dimensions
      - judgment_rule
      - required_fields
    data_outputs:
      - rows
      - features
      - returned_fields
      - judgment_result
      - evidence_summary
      - error_code
      - raw_locator
    builder_mapping:
      node_types: [lookup, data_check, transform, report]
      default_status: candidate
      common_nodes:
        - external_platform_query
        - generated_script_verification
        - sql_like_query
        - api_wrapper_query
        - dashboard_panel_extraction
        - manual_data_placeholder
    verification:
      verification_supported: true
      accepted_verification_inputs:
        - locator
        - query_template
        - api_endpoint
        - script_path
        - time_range
        - required_fields
      success_criteria:
        - "adapter can be invoked in the current runtime or explicitly marked manual"
        - "output is JSON or otherwise parseable"
        - "returned fields contain the fields required by the node judgment"
        - "judgment rule can be evaluated or read-only verified"
      example_judgment:
        rule: "current_drop_ratio > 0.05"
        required_fields: [current_value, baseline_value]

